name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  tests:
    runs-on: codeberg-small
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.3, 8.2]
        laravel: [12.*, 11.*]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            php${{ matrix.php }}-cli php${{ matrix.php }}-common \
            php${{ matrix.php }}-curl php${{ matrix.php }}-dom \
            php${{ matrix.php }}-mbstring php${{ matrix.php }}-zip \
            php${{ matrix.php }}-sqlite3 php${{ matrix.php }}-xml \
            php${{ matrix.php }}-bcmath php${{ matrix.php }}-intl \
            php${{ matrix.php }}-soap php${{ matrix.php }}-gd \
            php${{ matrix.php }}-exif
          sudo update-alternatives --set php /usr/bin/php${{ matrix.php }}

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest
